# NetWatch listens on loopback only. Do not change the address to 0.0.0.0.
[server]
address = "127.0.0.1"
port = 8501
headless = true
enableXsrfProtection = true
# Streamlit 1.66 treats enableCORS=false as "allow every origin".
# true keeps protection on. localhost and 127.0.0.1 remain allowed.
enableCORS = true
allowedHosts = ["localhost", "127.0.0.1"]
# Megabytes. core/packet_analyzer.py enforces the same 50 MB cap.
maxUploadSize = 50

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#4C8DFF"
backgroundColor = "#0b0f14"
secondaryBackgroundColor = "#141a22"
textColor = "#e6edf3"
font = "sans serif"
